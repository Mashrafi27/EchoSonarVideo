# GRPO config for the echo tool-agent, verl v0.7.1, CUDA box (4x RTX A6000 48GB).
#
# Launched by scripts/run_grpo.sh:
#   python -m verl.trainer.main_ppo --config-path <this dir> --config-name echo_grpo ...
#
# Extends verl's ppo_trainer defaults; only the echo-specific deltas live here.
# Everything sized for 4 Ampere GPUs with NO NVLink (FSDP all-gather over PCIe),
# no FP8. Tune knobs are in run_grpo.sh, not here.
hydra:
  searchpath:
    # installed verl package (not a relative path -- this repo is not the verl root)
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  # parquet from verl_bridge.generate_trainset (scripts/build_grpo_parquet.sh)
  train_files: build/rl_train.parquet
  val_files: build/rl_val.parquet
  train_batch_size: 32
  # With the overview strip thumbnailed (generate_trainset._OVERVIEW_MAX_PIXELS)
  # the initial prompt is ~1k tokens. The multi-turn response stream carries every
  # assistant turn PLUS each tool observation's re-encoded contact-sheet image
  # (~750 tokens/sheet); tokenizer.pad only pads UP, so this must exceed the
  # longest episode or the training tensors come out ragged and DataProto.concat
  # dies ("size 13743 vs 13739").
  max_prompt_length: 4096
  max_response_length: 4096
  # rows carry `images` (the view menu) and `videos: []` -- HYBRID frame path,
  # never a <video> (CLAUDE.md: Qwen3VLVideoProcessor silently resamples).
  image_key: images
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: error

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: Qwen/Qwen3-VL-8B-Instruct
    enable_gradient_checkpointing: True
    use_remove_padding: False       # verl's packing path is Qwen2-VL-shaped; see CLAUDE.md
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: True           # 8B + ref + optim on 48GB, no NVLink
      optimizer_offload: True
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: True
  rollout:
    name: vllm
    mode: async                     # required for the tool agent loop
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.7      # actor/optim are offloaded during rollout
    # Qwen3-VL ships a 262144 native context; unclamped, vLLM demands ~18 GiB KV
    # for a single request. Must comfortably exceed max_prompt_length + every
    # tool turn's (response + re-encoded contact-sheet image) or the agent loop
    # hands vLLM max_tokens=0 mid-episode and crashes.
    max_model_len: 20480
    enforce_eager: True
    free_cache_engine: True
    log_prob_micro_batch_size_per_gpu: 1
    n: 5
    checkpoint_engine:
      # embed_tokens is 151936x4096 fp32 (~2.4 GB) -> the default 2048 MB bucket
      # overflows the FSDP->vLLM weight sync. Just clear it; 8192 was wasteful
      # staging memory that itself OOM'd the update on 48 GB cards.
      update_weights_bucket_megabytes: 2560
    multi_turn:
      enable: True
      format: hermes
      tool_config_path: packages/verl_bridge/configs/echo_tool_config.yaml
      max_assistant_turns: 6
      max_tool_response_length: 512
      tokenization_sanity_check_mode: ignore_strippable

custom_reward_function:
  path: packages/verl_bridge/reward.py
  name: compute_score

trainer:
  critic_warmup: 0
  logger: ["console", "wandb"]
  project_name: echo-grpo
  experiment_name: grpo-qwen3vl8b
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 20
  test_freq: 20
  total_epochs: 1
  device: cuda
