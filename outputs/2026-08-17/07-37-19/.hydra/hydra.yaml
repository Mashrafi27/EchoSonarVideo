hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data.train_files=/vast/users/mohammad.yaqub/project/EchoSonarVideo/build/sft_smoke.parquet
    - data.train_batch_size=8
    - data.micro_batch_size_per_gpu=1
    - data.use_dynamic_bsz=True
    - data.max_token_len_per_gpu=16384
    - data.max_length=16384
    - data.pad_mode=no_padding
    - data.truncation=error
    - data.train_max_samples=8
    - data.num_workers=2
    - data.custom_cls.path=/vast/users/mohammad.yaqub/project/EchoSonarVideo/echo_verl/sft_dataset.py
    - data.custom_cls.name=EchoMultiTurnSFTDataset
    - model.path=Qwen/Qwen3-VL-8B-Instruct
    - model.use_remove_padding=False
    - model.enable_gradient_checkpointing=True
    - +model.override_config.attn_implementation=sdpa
    - engine=fsdp
    - optim=fsdp
    - optim.lr=1e-5
    - engine.strategy=fsdp2
    - engine.model_dtype=bf16
    - engine.ulysses_sequence_parallel_size=1
    - engine.use_torch_compile=False
    - trainer.device=cuda
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=4
    - trainer.total_epochs=1
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.logger=[console]
    - trainer.project_name=echo-sft
    - trainer.experiment_name=smoke
    - trainer.default_local_dir=/vast/users/mohammad.yaqub/project/EchoSonarVideo/.tmp_work/sft_smoke_ckpt
  job:
    name: sft_trainer
    chdir: null
    override_dirname: +model.override_config.attn_implementation=sdpa,data.custom_cls.name=EchoMultiTurnSFTDataset,data.custom_cls.path=/vast/users/mohammad.yaqub/project/EchoSonarVideo/echo_verl/sft_dataset.py,data.max_length=16384,data.max_token_len_per_gpu=16384,data.micro_batch_size_per_gpu=1,data.num_workers=2,data.pad_mode=no_padding,data.train_batch_size=8,data.train_files=/vast/users/mohammad.yaqub/project/EchoSonarVideo/build/sft_smoke.parquet,data.train_max_samples=8,data.truncation=error,data.use_dynamic_bsz=True,engine.model_dtype=bf16,engine.strategy=fsdp2,engine.ulysses_sequence_parallel_size=1,engine.use_torch_compile=False,engine=fsdp,model.enable_gradient_checkpointing=True,model.path=Qwen/Qwen3-VL-8B-Instruct,model.use_remove_padding=False,optim.lr=1e-5,optim=fsdp,trainer.default_local_dir=/vast/users/mohammad.yaqub/project/EchoSonarVideo/.tmp_work/sft_smoke_ckpt,trainer.device=cuda,trainer.experiment_name=smoke,trainer.logger=[console],trainer.n_gpus_per_node=4,trainer.nnodes=1,trainer.project_name=echo-sft,trainer.save_freq=-1,trainer.test_freq=-1,trainer.total_epochs=1
    id: ???
    num: ???
    config_name: sft_trainer_engine
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /vast/users/mohammad.yaqub/project/EchoSonarVideo
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /vast/users/mohammad.yaqub/project/EchoSonarVideo/external/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /vast/users/mohammad.yaqub/project/EchoSonarVideo/outputs/2026-08-17/07-37-19
    choices:
      profiler: profiler
      optim: fsdp
      engine: fsdp
      model: hf_model
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
