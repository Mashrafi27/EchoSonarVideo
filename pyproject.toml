[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echoprime-track"
version = "0.1.0"
description = "EchoSonarVideo: frozen EchoPrime + Qwen3-8B-text architecture (see packages/echoprime_track/)"
requires-python = ">=3.12"

# Editable install of ONLY echoprime_track -- this repo isn't otherwise a Python package (everything
# else runs via PYTHONPATH, unchanged); the sole purpose here is the entry point below, which
# needs a real installed-package metadata record to be discoverable at all (importlib.metadata
# entry_points() reads installed distributions, not arbitrary PYTHONPATH directories).
# package-dir points setuptools at packages/ so the installed import name stays "echoprime_track"
# (not "packages.echoprime_track") even though the source now lives one level deeper.
[tool.setuptools]
packages = ["echoprime_track"]
package-dir = {"" = "packages"}

# vLLM's `vllm.general_plugins` entry-point group is loaded in EVERY process that touches model
# loading -- the engine-core process, AND each multiproc_executor.py Worker subprocess (vLLM's
# own doc comment: "loaded in all processes(process0, engine core process and worker
# processes)"). This is the actual fix for a real bug found this session: our earlier attempt to
# register the model with a plain function call inside vllm_async_server.py's run_server()
# (external/verl-hf-rollout-registry.patch) only reached the SERVER's own process -- the
# separately-spawned Worker subprocesses re-import fresh and never saw it, crashing with the
# same "Invalid type of HuggingFace processor" error we'd already fixed once, just in a
# different process this time.
[project.entry-points."vllm.general_plugins"]
register_echoprime_model = "echoprime_track.register_vllm_model:register_echoprime_vllm_model"
