[pytest]
# Vendored reference trees (external/verl @ v0.7.1, external/DeepEyes) ship their
# own test suites that need torch/vLLM; never collect them.
testpaths = packages/tool_env packages/data_core packages/verl_bridge packages/eval
# norecursedirs is whitespace-split glob patterns, not shell -- no quoted paths with
# spaces. The data dir (data/raw_vqa/) is excluded by testpaths above, not here.
norecursedirs = external build .venv .git
